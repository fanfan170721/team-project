name: Java build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['11', '17']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile, test and package
        run: mvn -B --no-transfer-progress clean verify
      - name: Check packaged entry point
        run: java "-Djava.awt.headless=true" -jar target/wordtrail.jar --help
      - name: Check packaged application offline
        run: java "-Djava.awt.headless=true" --class-path target/wordtrail.jar tools/VerifyPackage.java target/package-check
      - name: Check Windows launcher behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/Test-Launcher.ps1
      - name: Check synthetic demo preparation and data protection
        run: java tools/TestDemoPreparation.java target/wordtrail.jar
      - name: Save test reports and rendered Swing screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/ui-snapshots/
            target/site/
            target/checkstyle-result.xml
            target/package-check/
      - name: Save executable JAR
        if: matrix.os == 'ubuntu-latest' && matrix.java == '11'
        uses: actions/upload-artifact@v4
        with:
          name: wordtrail-jar
          path: target/wordtrail.jar
          if-no-files-found: error
